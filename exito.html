<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Pago completado! · ChataPDF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .contenedor {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }

    .icono-exito {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bounceIn 0.6s ease-out;
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        transform: scale(1);
      }
    }

    h1 {
      color: #1a202c;
      font-size: 28px;
      margin-bottom: 12px;
    }

    .subtitulo {
      color: #718096;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .estado {
      background: #f0f9ff;
      border-left: 4px solid #667eea;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: left;
    }

    .estado p {
      color: #2d3748;
      font-size: 14px;
      margin: 8px 0;
    }

    .estado strong {
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .btn-descargar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-descargar:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-descargar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-volver {
      background: #e2e8f0;
      color: #2d3748;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    .btn-volver:hover {
      background: #cbd5e0;
    }

    .error {
      background: #fff5f5;
      border-left: 4px solid #f56565;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: left;
      display: none;
    }

    .error.visible {
      display: block;
    }

    .error p {
      color: #c53030;
      font-size: 14px;
      margin: 0;
    }

    .marca {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .marca-icono {
      margin-right: 8px;
    }

    .marca-pdf {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="marca">
      <span class="marca-icono">💬</span>Chata<span class="marca-pdf">PDF</span>
    </div>

    <div class="icono-exito" id="icono">✅</div>

    <h1 id="titulo">¡Pago completado!</h1>
    <p class="subtitulo" id="subtitulo">Tu PDF está listo para descargar.</p>

    <div class="estado" id="estado">
      <p><span class="spinner"></span> <strong>Procesando…</strong></p>
      <p id="mensaje-estado">Verificando el pago y preparando tu archivo.</p>
    </div>

    <div class="error" id="error">
      <p id="mensaje-error"></p>
    </div>

    <button class="btn-descargar" id="btn-descargar" disabled>
      Descargando…
    </button>

    <button class="btn-volver" id="btn-volver" onclick="window.location.href='/'">
      ← Volver al inicio
    </button>
  </div>

  <script>
  // ============================================================
  // VERIFICACIÓN DE PAGO + DESCARGA SEGURA
  // ============================================================

  const btnDescargar = document.getElementById('btn-descargar');
  const estado = document.getElementById('estado');
  const error = document.getElementById('error');
  const mensajeError = document.getElementById('mensaje-error');
  const titulo = document.getElementById('titulo');
  const subtitulo = document.getElementById('subtitulo');
  const icono = document.getElementById('icono');

  // Extraer session_id de la URL
  function obtenerSessionId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('session_id');
  }

  async function verificarYDescargar() {
    try {
      // 1) Obtener el session_id de la URL
      const sessionId = obtenerSessionId();

      if (!sessionId) {
        throw new Error('Sesión no válida. Vuelve al inicio e intenta de nuevo.');
      }

      // 2) VERIFICAR CON EL BACKEND que el pago es legítimo
      console.log('Verificando pago con session_id:', sessionId);
      const respuestaVerificacion = await fetch('/.netlify/functions/verificar-pago', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });

      if (!respuestaVerificacion.ok) {
        throw new Error(`Backend respondió con error ${respuestaVerificacion.status}`);
      }

      const datosVerificacion = await respuestaVerificacion.json();
      console.log('Respuesta del backend:', datosVerificacion);

      // 3) VALIDAR que el pago fue exitoso
      if (!datosVerificacion.pagado) {
        throw new Error(
          datosVerificacion.mensaje || 'El pago no se completó correctamente.'
        );
      }

      // 4) SI LLEGAMOS AQUÍ: el pago es legítimo. Recuperar y descargar el PDF
      const base64 = localStorage.getItem('chatapdf-pdf-pendiente');

      if (!base64) {
        throw new Error('No hay PDF guardado. Vuelve al inicio e intenta de nuevo.');
      }

      // 5) Convertir Base64 a blob
      const respuestaFetch = await fetch(base64);
      const blob = await respuestaFetch.blob();

      // 6) Crear enlace de descarga y dispararlo
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = 'chat-whatsapp.pdf';
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);

      // 7) Limpiar localStorage
      localStorage.removeItem('chatapdf-pdf-pendiente');

      // 8) Actualizar la UI
      estado.style.display = 'none';
      btnDescargar.textContent = '✅ PDF descargado';
      btnDescargar.disabled = true;

      // Liberar la URL
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('Error:', err);
      mostrarError(err.message);
    }
  }

  function mostrarError(msg) {
    icono.textContent = '❌';
    titulo.textContent = 'Algo salió mal';
    subtitulo.textContent = 'No pudimos procesar tu descarga.';
    estado.style.display = 'none';
    error.classList.add('visible');
    mensajeError.textContent = msg;
    btnDescargar.style.display = 'none';
  }

  // Ejecutar cuando carga la página
  window.addEventListener('load', () => {
    setTimeout(verificarYDescargar, 500);
  });

  // Permitir descarga manual si algo falla
  btnDescargar.addEventListener('click', verificarYDescargar);
</script>
</body>
</html>
